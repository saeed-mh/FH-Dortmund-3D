<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EFS Campus 3D</title>
    <meta name="description" content="Geo-accurate 3D model of the FH Dortmund campus at Emil-Figge-Strasse" />
    <script type="module" crossorigin src="./assets/index-Bc_EJHW7.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-B13gy3eX.css">
  </head>
  <body>
    <div id="app">
      <div id="viewport"></div>
      <aside id="panel" aria-label="Campus navigator">
        <header class="panel-head">
          <button id="panel-toggle" class="icon-btn" aria-label="Toggle panel" aria-expanded="true">☰</button>
          <div>
            <h1>EFS Campus</h1>
            <p class="muted">FH Dortmund · Emil-Figge-Straße</p>
          </div>
        </header>
        <div class="panel-body">
          <input id="search" type="search" placeholder="Search buildings or rooms (e.g. 42 1.07, lab)" autocomplete="off" />
          <ul id="results" class="list"></ul>
          <section id="selection" hidden></section>
          <section>
            <h2>FH buildings</h2>
            <ul id="fh-list" class="list"></ul>
          </section>
          <section>
            <h2>Layers</h2>
            <div class="seg" role="radiogroup" aria-label="Ground">
              <button data-ground="aerial" class="on">Aerial photo</button>
              <button data-ground="map">Map</button>
            </div>
            <label class="check"><input type="checkbox" data-layer="labels" checked /> Labels</label>
            <label class="check"><input type="checkbox" data-layer="others" checked /> Other buildings</label>
            <label class="check"><input type="checkbox" data-layer="trees" checked /> Trees</label>
            <label class="check"><input type="checkbox" data-layer="hbahn" checked /> H-Bahn</label>
            <label class="check"><input type="checkbox" data-layer="entrances" checked /> Entrances <span class="key real"></span> mapped <span class="key assumed"></span> assumed</label>
          </section>
        </div>
      </aside>
      <div id="hud">
        <button id="compass" class="compass" aria-label="Reset to north" title="North up">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <circle cx="20" cy="20" r="18" />
            <g id="needle">
              <path d="M20 5 L25 20 L15 20 Z" class="n" />
              <path d="M20 35 L25 20 L15 20 Z" class="s" />
              <text x="20" y="14.5" text-anchor="middle">N</text>
            </g>
          </svg>
        </button>
        <button id="home" class="icon-btn hud-btn" title="Whole campus" aria-label="Show whole campus">⌂</button>
      </div>
      <footer id="attribution"></footer>
      <div id="loading">Loading campus…</div>
    </div>
  </body>
</html>
